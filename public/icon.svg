<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A070B" />
      <stop offset="50%" stop-color="#2D0B12" />
      <stop offset="100%" stop-color="#140508" />
    </linearGradient>

    <!-- Crimson Silk Gradient -->
    <linearGradient id="favCrimson" x1="10%" y1="10%" x2="90%" y2="90%">
      <stop offset="0%" stop-color="#E22E46" />
      <stop offset="45%" stop-color="#B3192D" />
      <stop offset="100%" stop-color="#6A0C1A" />
    </linearGradient>

    <!-- Gold Silk Gradient -->
    <linearGradient id="favGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF2CE" />
      <stop offset="35%" stop-color="#E8C56B" />
      <stop offset="70%" stop-color="#C2922D" />
      <stop offset="100%" stop-color="#7C550E" />
    </linearGradient>

    <filter id="favShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Luxury Curved Squircle Tile -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" />
  <rect x="1.5" y="1.5" width="61" height="61" rx="14.5" stroke="#D4AF37" stroke-width="1.2" stroke-opacity="0.35" />

  <!-- Sacred Ribbon Knot 'V' Symbol (Gathbandhan) -->
  <g transform="translate(11, 10) scale(0.42)" filter="url(#favShadow)">
    <!-- Back Gold Ribbon -->
    <path
      d="M58 35 C64 24, 76 18, 83 20 C85 20.5, 87 23, 86 26 C82 35, 71 52, 62 66 C57 73, 52 79, 48 83 C49 80, 52 68, 55 56 C57 48, 58 41, 58 35 Z"
      fill="url(#favGold)"
    />

    <!-- Crimson Silk Left Arm -->
    <path
      d="M20 22 C23 20, 27 22, 29 25 C31 29, 30 33, 26 35 C23 35, 20 31, 19 27 C18.5 24.5, 19 23, 20 22 Z"
      fill="#F0485E"
    />
    <path
      d="M27 24 C33 26, 38 33, 41 42 C46 54, 49 68, 51 79 C51.5 82, 51 84, 48.5 84.5 C46 85, 43 82, 40 76 C36 67, 30 52, 25 39 C23 34, 21 28, 27 24 Z"
      fill="url(#favCrimson)"
    />

    <!-- Intertwining Gold Right Arm -->
    <path
      d="M82 20 C85 20.5, 88 23.5, 87 27 C84 37, 74 54, 65 67 C59 76, 54 81, 49 84 C48.5 83, 49 81, 50 78 C54 73, 62 60, 69 49 C74 41, 79 31, 80 25 C80.5 22, 79 21, 82 20 Z"
      fill="url(#favGold)"
    />

    <!-- Front Overlapping Gold Knot -->
    <path
      d="M37 46 C41 40, 48 37, 54 41 C57 43, 58 48, 56 53 C53 60, 48 70, 43 78 C40 82, 38 82, 38.5 80 C40 73, 46 61, 49 54 C50.5 50, 49.5 47, 46 46 C42 45, 38 48, 37 46 Z"
      fill="#FFE599"
    />

    <!-- Auspicious Dot -->
    <circle cx="51" cy="18" r="3" fill="#FFF2CE" />
  </g>
</svg>
