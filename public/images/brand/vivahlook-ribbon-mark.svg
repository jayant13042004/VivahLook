<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <!-- Crimson Silk Gradients -->
    <linearGradient id="crimsonFront" x1="15%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#B81D33" />
      <stop offset="35%" stop-color="#8E1426" />
      <stop offset="70%" stop-color="#6E0B1B" />
      <stop offset="100%" stop-color="#4E0512" />
    </linearGradient>
    <linearGradient id="crimsonHighlight" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#E63950" />
      <stop offset="50%" stop-color="#C22038" />
      <stop offset="100%" stop-color="#8E1426" />
    </linearGradient>
    <linearGradient id="crimsonFold" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4A0610" />
      <stop offset="60%" stop-color="#780F20" />
      <stop offset="100%" stop-color="#A3172C" />
    </linearGradient>

    <!-- Champagne Gold Silk Gradients -->
    <linearGradient id="goldFront" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#FBF2CE" />
      <stop offset="25%" stop-color="#E9CA76" />
      <stop offset="60%" stop-color="#CF9E38" />
      <stop offset="85%" stop-color="#AA791C" />
      <stop offset="100%" stop-color="#78520D" />
    </linearGradient>
    <linearGradient id="goldHighlight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF0" />
      <stop offset="40%" stop-color="#F2DA91" />
      <stop offset="100%" stop-color="#B8861B" />
    </linearGradient>
    <linearGradient id="goldBackFold" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8F6513" />
      <stop offset="60%" stop-color="#B8861B" />
      <stop offset="100%" stop-color="#DFC06A" />
    </linearGradient>

    <!-- Drop Shadow for Intertwined Depth -->
    <filter id="ribbonShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="1" dy="3" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.32" />
    </filter>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#D4AF37" flood-opacity="0.25" />
    </filter>
  </defs>

  <g id="SacredRibbonKnotV" filter="url(#ribbonShadow)">
    <!-- 1. BACK GOLD FOLD (Curves behind the crimson ribbon) -->
    <path
      d="M58 35 C64 24, 76 18, 83 20 C85 20.5, 87 23, 86 26 C82 35, 71 52, 62 66 C57 73, 52 79, 48 83 C49 80, 52 68, 55 56 C57 48, 58 41, 58 35 Z"
      fill="url(#goldBackFold)"
    />

    <!-- 2. CRIMSON SILK RIBBON (Main Left-to-Base Sweeping Ribbon) -->
    <!-- Top Cut/Fold of Crimson Ribbon -->
    <path
      d="M20 22 C23 20, 27 22, 29 25 C31 29, 30 33, 26 35 C23 35, 20 31, 19 27 C18.5 24.5, 19 23, 20 22 Z"
      fill="url(#crimsonHighlight)"
    />
    <!-- Sweeping Downward Curve of Crimson Ribbon -->
    <path
      d="M27 24 C33 26, 38 33, 41 42 C46 54, 49 68, 51 79 C51.5 82, 51 84, 48.5 84.5 C46 85, 43 82, 40 76 C36 67, 30 52, 25 39 C23 34, 21 28, 27 24 Z"
      fill="url(#crimsonFront)"
    />
    <!-- Crimson Vertex Turn & Front Lapel -->
    <path
      d="M48.5 84.5 C51 84, 53 80, 55 74 C57 66, 59 55, 61 46 C57 56, 52 71, 48 79 C46 83, 47 84.5, 48.5 84.5 Z"
      fill="url(#crimsonFold)"
    />

    <!-- 3. GOLD SILK RIBBON (Main Intertwining Right Ribbon) -->
    <!-- Top Right Silk Lapel -->
    <path
      d="M82 20 C85 20.5, 88 23.5, 87 27 C84 37, 74 54, 65 67 C59 76, 54 81, 49 84 C48.5 83, 49 81, 50 78 C54 73, 62 60, 69 49 C74 41, 79 31, 80 25 C80.5 22, 79 21, 82 20 Z"
      fill="url(#goldHighlight)"
    />
    <!-- Front Overlapping Gold Loop (Weaves through and in front of the crimson ribbon) -->
    <path
      d="M37 46 C41 40, 48 37, 54 41 C57 43, 58 48, 56 53 C53 60, 48 70, 43 78 C40 82, 38 82, 38.5 80 C40 73, 46 61, 49 54 C50.5 50, 49.5 47, 46 46 C42 45, 38 48, 37 46 Z"
      fill="url(#goldFront)"
    />

    <!-- 4. SUBTLE ACCENT / AUSPICIOUS BINDI DROPLET -->
    <circle cx="51" cy="18" r="2.2" fill="url(#goldHighlight)" filter="url(#subtleGlow)" />
  </g>
</svg>
